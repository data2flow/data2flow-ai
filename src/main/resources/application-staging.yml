# staging: JSON 로그(요청 ID는 MDC requestId), 비밀값은 k8s Secret 환경변수. Flyway migrate는 staging에서만(ADR-030, expand만)
# LLM 키가 없는 동안 시연은 FAKE 제공자(시뮬레이터 데이터만 쓰는 전용 조직, ADR-030·040)
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: net.java21.data2flow.contracts.secret.SecretMaskingJsonMembersCustomizer
data2flow:
  ai:
    flyway-mode: migrate
    llm:
      default-provider: ${DATA2FLOW_AI_DEFAULT_PROVIDER:FAKE}
      allowed-providers: ${DATA2FLOW_AI_ALLOWED_PROVIDERS:NONE,FAKE,ANTHROPIC}
