# 로컬 개발. 인프라는 s3 SSH 터널·공용 개발 DB로 붙는다(design/deployment.md §8.2). 비밀값은 루트 .env
# LLM 키가 없으므로 FAKE 제공자를 고를 수 있게 한다(ADR-040)
logging:
  level:
    net.java21.data2flow: DEBUG
data2flow:
  ai:
    llm:
      default-provider: ${DATA2FLOW_AI_DEFAULT_PROVIDER:FAKE}
      allowed-providers: ${DATA2FLOW_AI_ALLOWED_PROVIDERS:NONE,FAKE,ANTHROPIC}
